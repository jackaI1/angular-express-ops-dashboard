name: Dashboard checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API integration tests and Angular dashboard tests
        run: npm test
      - name: Build API and Angular dashboard
        run: npm run build
      - name: Seed twice and exercise the compiled app
        run: npm run test:smoke
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise dashboard controls at desktop and mobile sizes
        run: npm run test:browser
